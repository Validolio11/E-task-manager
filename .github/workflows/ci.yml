name: Validate E-task

on:
  pull_request:
  push:
    branches:
      - main
      - codex/initial-app-scaffold
      - agent/windows-installer-updater

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo check --manifest-path src-tauri/Cargo.toml
