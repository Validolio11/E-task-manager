[package]
name = "e-task"
version = "0.3.1"
description = "Minimal focus-first task manager"
authors = ["Validolio11"]
license = "MIT"
repository = "https://github.com/Validolio11/E-task-manager"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "e_task_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3" }

[dependencies]
tauri = { version = "=2.11.5" }
